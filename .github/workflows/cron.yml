name: Hourly cron

# Vercel Hobby only allows one cron run per day (see vercel.json: recurring rules, 00:00 Bangkok).
# The daily reminder needs an hourly tick, so GitHub Actions calls the endpoint instead.
# Needs two repository secrets: APP_BASE_URL (https://<your-domain>) and CRON_SECRET (same value
# as in Vercel). Without them the job exits quietly. On a Vercel plan that allows hourly crons,
# move this entry into vercel.json and delete this workflow.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/reminders
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_BASE_URL / CRON_SECRET secrets are not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_BASE_URL%/}/api/cron/reminders"
          echo
